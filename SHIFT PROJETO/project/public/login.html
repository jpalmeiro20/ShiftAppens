<!DOCTYPE html>

<html lang = "pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - What's the plan</title>
    <link rel="stylesheet" href="login.css"> 
</head>

<body>
    <div class="login_box" id="loginBox">
        <h1>Login</h1>
        <form>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Introduza o seu email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Introduza a sua password" required>

            <button type="submit">Entrar</button>
        </form>

        <div class="error-message" style="display: none;">
            <p></p> 
        </div>

        <div class="links">
            <p><a href="signup.html">Sign Up</a></p>
            <p><a href="forgot_password.html">Esqueceu a senha!</a></p>
        </div>
    </div>
</body>

</html>
