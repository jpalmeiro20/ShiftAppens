<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - what's the plan</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="register_box">
        <h2>Sign up</h2>
        <form id="register-form">
            <label for="username">Nome de Usuário:</label>
            <input type="text" id="username" required><br>

            <label for="email">Email:</label>
            <input type="email" id="email" required><br>

            <label for="password">Password:</label>
            <input type="password" id="password" required><br>

            <label for="password_confirmation">Confirme a password:</label>
            <input type="password" id="password_confirmation" required><br>

            <button type="submit">Registrar</button>
        </form>

        <div class="error-message" style="display: none;">
            <p></p> 
        </div>

        <div class="links">
            <p><a href="login.html">Já tem conta? Faça login aqui</a></p>
        </div>
    </div>
</body>
</html>
